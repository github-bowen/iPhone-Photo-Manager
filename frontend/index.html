<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iPhone Photo Manager — Browse and search your photo library by time and location">
  <title data-i18n="app_title">iPhone 照片管理</title>
  <link rel="stylesheet" href="/index.css?v=6">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">📸</div>
          <span class="sidebar-logo-text" data-i18n="app_title"></span>
        </div>
      </div>

      <!-- Timeline Section -->
      <div class="sidebar-section" id="sidebar-timeline-section">
        <div class="sidebar-section-title">📅 <span data-i18n="timeline"></span></div>
        <div id="sidebar-timeline"></div>
      </div>

      <!-- Locations Section -->
      <div class="sidebar-section" id="sidebar-locations-section">
        <div class="sidebar-section-title">📍 <span data-i18n="locations"></span></div>
        <div id="sidebar-locations"></div>
      </div>

      <!-- Stats -->
      <div class="sidebar-stats" id="sidebar-stats">
        <span data-i18n="loading"></span>
      </div>
      <!-- Mobile Sidebar Overlay -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Scan Banner -->
      <div class="scan-banner hidden" id="scan-banner">
        <div class="scan-banner-spinner"></div>
        <span id="scan-banner-text" data-i18n="scanning"></span>
        <div class="scan-banner-progress">
          <div class="scan-banner-progress-bar" id="scan-banner-progress"></div>
        </div>
      </div>

      <!-- Header / Toolbar -->
      <header class="header" id="header">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-input"
                 data-i18n-placeholder="search_placeholder" autocomplete="off">
        </div>
        <div class="filter-group" id="filter-group">
          <button class="filter-btn active" data-filter="all" id="filter-all" data-i18n="filter_all"></button>
          <button class="filter-btn" data-filter="HEIC" id="filter-heic" data-i18n="filter_photos"></button>
          <button class="filter-btn" data-filter="MOV" id="filter-mov" data-i18n="filter_videos"></button>
          <button class="filter-btn" data-filter="PNG" id="filter-png" data-i18n="filter_screenshots"></button>
          <input type="date" class="date-input" id="date-from" data-i18n-title="date_from">
          <input type="date" class="date-input" id="date-to" data-i18n-title="date_to">
        </div>

        <div class="header-actions">
          <button class="header-action-btn" id="autoplay-btn" title="Slideshow / 幻灯片">
            ▶️ <span data-i18n="slideshow" style="font-size: 13px;">幻灯片</span>
          </button>
          <div class="toggle-pill active" id="sort-toggle" title="Sort Order / 排序">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left">🔽</div>
            <div class="toggle-pill-option right">🔼</div>
          </div>
          <div class="toggle-pill" id="theme-toggle" title="Theme / 主题">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></div>
            <div class="toggle-pill-option right"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></div>
          </div>
          <div class="toggle-pill" id="load-original-toggle" title="Image Quality">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left">⚡️</div>
            <div class="toggle-pill-option right">4K</div>
          </div>
          <div class="toggle-pill" id="lang-toggle" title="Language / 语言">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left">中</div>
            <div class="toggle-pill-option right">EN</div>
          </div>
        </div>
      </header>

      <!-- Photo Gallery -->
      <div class="gallery-container" id="gallery-container">
        <div id="gallery"></div>
        <div class="load-more-container" id="load-more-container" style="display:none;">
          <button class="load-more-btn" id="load-more-btn" data-i18n="load_more"></button>
        </div>
      </div>
    </main>
  </div>

  <!-- Photo Detail Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <!-- Floating Autoplay Toolbar -->
    <div id="modal-autoplay-toolbar" style="display: none; position: absolute; top: 20px; left: 20px; z-index: 60; align-items: center; gap: 16px; background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3);">
      
      <button id="modal-autoplay-toggle" style="background: var(--accent-purple); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">▶</button>
      
      <div style="display: flex; align-items: center; gap: 8px;">
        <label style="color: white; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">⏱️</label>
        <input type="range" id="modal-autoplay-duration" value="3" min="1" max="10" step="1" style="width: 60px; accent-color: var(--accent-purple);">
        <span id="modal-autoplay-dur-val" style="color: white; font-size: 13px; font-weight: bold; min-width: 20px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">3s</span>
      </div>
      
      <div style="display: flex; align-items: center; gap: 6px; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 16px;">
        <input type="checkbox" id="modal-autoplay-wait-video" checked style="accent-color: var(--accent-purple); cursor: pointer; width: 14px; height: 14px;">
        <label for="modal-autoplay-wait-video" style="color: white; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.5);" data-i18n="autoplay_wait_video"> Wait Video </label>
      </div>
    </div>

    <button class="modal-close" id="modal-close" data-i18n-title="close_btn">✕</button>
    <div class="modal-content">
      <div class="modal-image-container" id="modal-image-container">
        
        <button class="modal-nav prev" id="modal-prev" data-i18n-title="prev_btn">‹</button>
        <!-- Image or video will be inserted here dynamically -->
        <button class="modal-nav next" id="modal-next" data-i18n-title="next_btn">›</button>
      </div>
      <div class="modal-info" id="modal-info">
        <!-- Photo details will be inserted here dynamically -->
      </div>
    </div>
  </div>

  <!-- Autoplay Config Modal -->
  <div id="autoplay-config-modal" class="autoplay-modal-overlay">
    <div class="autoplay-modal-content">
      <h3 class="autoplay-modal-title">▶️ <span data-i18n="slideshow_config">幻灯片播放设置</span></h3>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label">📅 日期范围</label>
        <div class="autoplay-modal-row">
          <input type="date" id="autoplay-date-from" class="date-input" style="flex: 1;">
          <input type="date" id="autoplay-date-to" class="date-input" style="flex: 1;">
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label">📍 地点范围 (国家)</label>
        <div id="autoplay-location-container" class="autoplay-checkbox-group">
          <!-- Checkboxes injected by JS -->
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label">🖼️ 媒体类型</label>
        <div class="autoplay-checkbox-group">
          <label class="autoplay-checkbox-label"><input type="checkbox" id="autoplay-type-photo" checked> 照片</label>
          <label class="autoplay-checkbox-label"><input type="checkbox" id="autoplay-type-video" checked> 视频</label>
          <label class="autoplay-checkbox-label"><input type="checkbox" id="autoplay-type-screenshot"> 截图</label>
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label">⏱️ 每张停留时长</label>
        <div class="autoplay-range-row">
          <input type="range" id="autoplay-duration" value="3" min="1" max="10" step="1" style="flex: 1; accent-color: var(--accent-purple);">
          <span id="autoplay-duration-display" style="min-width: 32px; text-align: center; color: var(--text-primary); font-weight: bold; font-size: 14px;">3s</span>
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-checkbox-label" style="padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border-subtle); border-radius: 12px; font-weight: 600;">
          <input type="checkbox" id="autoplay-wait-video" checked>
          播放完整视频 / Live 图后再切换
        </label>
      </div>

      <div class="autoplay-actions">
        <button id="autoplay-cancel-btn" class="autoplay-btn-cancel">取消</button>
        <button id="autoplay-start-btn" class="autoplay-btn-start">▶ 开始播放</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay (initial scan) -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text" data-i18n="initializing"></div>
    <div class="loading-progress">
      <div class="loading-progress-bar" id="loading-progress-bar"></div>
    </div>
  </div>

  <script type="module" src="/js/main.js?v=2"></script>
</body>
</html>
